<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie</title>
</head>
<body>

<script>
    var tablica = [];
    var wybor = prompt("Wybierz liczbę z przedziału 1;3");

    if (wybor == 1) {
        for (var i = 0; i < 50; i++) {
            tablica[i] = i;
            document.write(tablica[i] + " ");
        }
    } else if (wybor == 2) {
        for (var i = 100; i >= 1; i--) {
            tablica[i] = i;
            document.write(tablica[i] + "<br>");
        }
    } else if (wybor == 3) {
        for (var i = 2; i <= 200; i = i + 2) {
            tablica[i] = i;
            document.write(tablica[i] + " ");
        }
    } else {
        document.write("Nie wybrano liczby z przedziału 1-3!");
    }
</script>

</body>
</html>
